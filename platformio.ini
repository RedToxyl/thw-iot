; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif8266
board = d1_mini
framework = arduino
upload_port = /dev/cu.usbserial-110
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit NeoPixel
	MFRC522
	OneWire
	DallasTemperature
	Adafruit MPR121@1.1.3
	bertmelis/espMqttClient@^1.7.2
	PubSubClient
default_envs = module4

[env:ota-flash]
build_src_filter = 
	-<*>
	+<module04/task05-ota/>

[env:ota]
build_src_filter = 
	-<*>
	+<module04/task06-alarm/>
upload_protocol = espota
upload_port = ota-test
upload_flags = --auth=iotempower


[env:module4]
build_src_filter = 
	-<*>
	+<module04/task07-node_a/>
lib_deps = 
	PubSubClient
	espSoftwareSerial
	WiFi
#upload_port = /dev/cu.usbserial-1101
platform = espressif32
board = mhetesp32minikit
upload_protocol = espota
upload_port = esp32-minikitA.local
upload_flags = --auth=iotempower